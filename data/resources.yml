  - id: 988-suicide-crisis-lifeline
    name: "988 Suicide & Crisis Lifeline"
    audience: [general, medical-student, resident, physician, mental-health-professional]
    type: crisis-support
    topics: [suicide-prevention, crisis-support, mental-health]
    scope: national
    region: [US]
    cost: free
    access: [phone, text, chat, public-web]
    evidence_level: institutional-resource
    evidence_basis: "Operated under a cooperative agreement with SAMHSA (U.S. Department of Health and Human Services). 15-point checklist verification completed against 988lifeline.org and its Terms of Service on 2026-10-09. Evidence level describes the service as a resource, not clinical efficacy."
    privacy: "No personally identifiable information required to receive support. Terms of Service: contact information is not shared outside the 988 Lifeline without consent, except imminent-risk exceptions (imminent physical harm, suicide attempt or overdose in progress, medical emergency, abuse/neglect, threats to a contact center), in which PII may be disclosed to 911/law enforcement/mobile crisis."
    confidentiality: "Homepage states conversations are 'free and confidential'. Terms of Service: 'You have the right to expect that information about your contact with the 988 Lifeline will not be shared outside the 988 Lifeline without your consent', subject to the imminent-risk exceptions noted under privacy."
    clinical_use: false
    emergency_resource: true
    language_access: "Interpretation services provided at no cost for people whose primary language is not English; Deaf/HoH resources and ASL videophone available."
    last_reviewed: "2026-10-09"
    review_status: verified-entry
    source_organization: "988 Suicide & Crisis Lifeline"
    official_url: "https://988lifeline.org/"
    description: "National crisis-support entry point for people experiencing suicidal, mental-health, or substance-use crisis. Available 24/7/365: call or text 988, web chat (chat.988lifeline.org), or ASL videophone."
    limitations: "Not a medical provider or a substitute for emergency medical services or ongoing clinical care; call 911 first for an immediate physical safety threat. SAMHSA and the network administrator charge no fee, but carrier phone-plan charges, emergency-dispatch costs, and outside-referral costs may apply."

  - id: physician-support-line
    name: "Physician Support Line"
    audience: [medical-student, resident, physician]
    type: peer-support
    topics: [physician-wellbeing, peer-support, stress, anxiety, depression]
    scope: national
    region: [US]
    cost: free
    access: [phone]
    evidence_level: community-resource
    evidence_basis: "No published outcome evaluation of this specific line was located. Peer-support program operated by a nonprofit and staffed by volunteer psychiatrists; news coverage documents operation since March 2020. 15-point checklist verification completed against physiciansupportline.com on 2026-10-10. Evidence level describes the service as a resource, not clinical efficacy."
    privacy: "Homepage describes the line as 'Confidential & Anonymous' and states 'We report to no one' (2026-10-10). No separate written privacy policy was located on the official site."
    confidentiality: "Homepage states the line is 'Free, Confidential & Anonymous' and 'We report to no one' (2026-10-10); calls are answered by volunteer psychiatrists, no appointment necessary."
    clinical_use: false
    emergency_resource: false
    language_access: "Not documented on the official site; marked unknown (2026-10-10)."
    last_reviewed: "2026-10-10"
    review_status: verified-entry
    source_organization: "Physician Support Line"
    official_url: "https://www.physiciansupportline.com/"
    description: "National peer-support line for U.S. physicians and medical students, staffed by hundreds of volunteer psychiatrists. Call 1-888-409-0141; no appointment necessary. Open Monday to Friday, 8:00 AM-11:00 PM ET, except federal holidays. Calls are free, confidential, and anonymous. For any issue, not just a crisis; peer support, not clinical treatment."
    limitations: "Not a crisis hotline and not a medical provider; peer support, not clinical treatment. Hours limited to weekdays (ET); phone only. Eligibility limited to U.S. physicians and medical students."

