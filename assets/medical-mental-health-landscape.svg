<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2600" viewBox="0 0 1800 2600">
<rect width="1800" height="2600" fill="#ffffff"/>
<rect width="1800" height="360" fill="#111111"/>
<text x="100" y="115" font-family="Arial, sans-serif" font-size="78" font-weight="700" fill="#ffffff">DocTalk</text>
<text x="105" y="180" font-family="Arial, sans-serif" font-size="45" font-weight="700" fill="#ffffff">Medical Mental Health Resource Center</text>
<text x="105" y="245" font-family="Arial, sans-serif" font-size="32" fill="#ffffff">Research landscape + build strategy</text>

<rect x="90" y="410" width="1620" height="300" rx="28" fill="#f4f4f4" stroke="#222" stroke-width="3"/>
<text x="130" y="465" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#111">THE SIGNAL</text>
<text x="140" y="540" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#111">~29%</text>
<text x="330" y="540" font-family="Arial, sans-serif" font-size="27" fill="#222">residents with depression/depressive symptoms</text>
<text x="140" y="595" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#111">~29%</text>
<text x="330" y="595" font-family="Arial, sans-serif" font-size="27" fill="#222">practicing physicians with depression/depressive symptoms</text>
<text x="930" y="540" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#111">48%</text>
<text x="1080" y="540" font-family="Arial, sans-serif" font-size="27" fill="#222">student depression in one COVID-era review</text>
<text x="930" y="595" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#111">15–27%</text>
<text x="1150" y="595" font-family="Arial, sans-serif" font-size="27" fill="#222">resident suicidal/death-related thoughts</text>

<text x="100" y="780" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#111">WHAT THEY ARE UP AGAINST</text>
<g font-family="Arial, sans-serif">
<rect x="90" y="830" width="760" height="205" rx="26" fill="#fafafa" stroke="#222" stroke-width="2"/>
<text x="125" y="885" font-size="30" font-weight="700">INDIVIDUAL</text>
<text x="125" y="935" font-size="25">Sleep loss, perfectionism, imposter syndrome,</text>
<text x="125" y="970" font-size="25">debt, family pressures and mental-health symptoms.</text>
<rect x="890" y="830" width="760" height="205" rx="26" fill="#fafafa" stroke="#222" stroke-width="2"/>
<text x="925" y="885" font-size="30" font-weight="700">TRAINING</text>
<text x="925" y="935" font-size="25">Long hours, evaluations, hidden curriculum,</text>
<text x="925" y="970" font-size="25">poor supervision and steep residency transitions.</text>
<rect x="90" y="1080" width="760" height="205" rx="26" fill="#fafafa" stroke="#222" stroke-width="2"/>
<text x="125" y="1135" font-size="30" font-weight="700">SYSTEM</text>
<text x="125" y="1185" font-size="25">EHR burden, administrative work, staffing shortages,</text>
<text x="125" y="1220" font-size="25">workload, leave policies and moral distress.</text>
<rect x="890" y="1080" width="760" height="205" rx="26" fill="#fafafa" stroke="#222" stroke-width="2"/>
<text x="925" y="1135" font-size="30" font-weight="700">CULTURE</text>
<text x="925" y="1185" font-size="25">Stigma, pressure to tough it out, bullying,</text>
<text x="925" y="1220" font-size="25">harassment, discrimination and isolation.</text>
<rect x="90" y="1330" width="760" height="205" rx="26" fill="#fafafa" stroke="#222" stroke-width="2"/>
<text x="125" y="1385" font-size="30" font-weight="700">ACCESS</text>
<text x="125" y="1435" font-size="25">Time, cost, insurance, clinician availability</text>
<text x="125" y="1470" font-size="25">and lack of awareness.</text>
<rect x="890" y="1330" width="760" height="205" rx="26" fill="#fafafa" stroke="#222" stroke-width="2"/>
<text x="925" y="1385" font-size="30" font-weight="700">CAREER RISK</text>
<text x="925" y="1435" font-size="25">Fear that seeking mental-health care could affect</text>
<text x="925" y="1470" font-size="25">licensing, credentialing or professional identity.</text>
</g>

<text x="100" y="1600" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#111">WHAT ALREADY EXISTS</text>
<g font-family="Arial, sans-serif" font-size="28" fill="#222">
<text x="120" y="1670">• Crisis: 988, NAMI HelpLine, Physician Support Line</text>
<text x="120" y="1720">• Clinician support: Physician Health Programs, peer support, residency wellness</text>
<text x="120" y="1770">• Institutional care: student counseling centers, EAPs</text>
<text x="120" y="1820">• Education: Mental Health First Aid, wellness and communication curricula</text>
<text x="120" y="1870">• Measurement: Stanford Professional Fulfillment Index and assessment tools</text>
<text x="120" y="1920">• Policy: Joint Commission and IHI workforce well-being resources</text>
<text x="120" y="1970">• Communities: peer-support networks and student mental-health organizations</text>
</g>

<rect x="90" y="2040" width="1620" height="430" rx="28" fill="#f4f4f4" stroke="#222" stroke-width="3"/>
<text x="125" y="2100" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#111">THE DOCTALK OPPORTUNITY</text>
<g font-family="Arial, sans-serif" font-size="27" fill="#222">
<text x="140" y="2160">• Fragmentation: resources are scattered across institutions and organizations.</text>
<text x="140" y="2205">• Evidence ambiguity: users cannot easily distinguish research from guidance or community resources.</text>
<text x="140" y="2250">• Audience mismatch: student, resident, physician and educator needs differ.</text>
<text x="140" y="2295">• Localization: geography, licensing, insurance and access constraints matter.</text>
<text x="140" y="2340">• Maintenance: resources change, so review dates and contribution workflows are essential.</text>
</g>
<text x="140" y="2415" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111">MVP: ~50 vetted resources • ~10 categories • structured metadata • GitHub contributions • searchable web layer</text>
<text x="100" y="2540" font-family="Arial, sans-serif" font-size="24" fill="#333">Research foundation for DocTalk | Evidence-informed | Inclusion does not imply endorsement</text>
</svg>